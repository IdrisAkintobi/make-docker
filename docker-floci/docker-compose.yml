# Floci GitHub: https://github.com/floci-io/floci
# API Gateway: http://localhost:4566
services:
  floci:
    container_name: "${FLOCI_DOCKER_NAME:-floci}"
    image: floci/floci:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_floci/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:4566:4566"            # Floci Gateway
    environment:
      - FLOCI_STORAGE_MODE=${FLOCI_STORAGE_MODE:-memory}
      - FLOCI_DEFAULT_REGION=${FLOCI_DEFAULT_REGION:-us-east-1}
      - FLOCI_DEFAULT_ACCOUNT_ID=${FLOCI_DEFAULT_ACCOUNT_ID:-000000000000}
    volumes:
      - "${FLOCI_VOLUME_DIR:-./data}:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
